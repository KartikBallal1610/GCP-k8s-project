apiVersion: v1
kind: Service
metadata:
  name: hello-app-service
  namespace: default
  labels:
    app: hello-app
  annotations:
    # Keep the external IP stable across re-deploys
    cloud.google.com/neg: '{"ingress": true}'
spec:
  type: LoadBalancer
  selector:
    app: hello-app
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 3000
